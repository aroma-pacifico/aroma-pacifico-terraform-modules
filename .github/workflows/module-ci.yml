name: Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.8"

jobs:
  discover:
    name: Discover validation targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      samples: ${{ steps.set-targets.outputs.samples }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: List module and sample directories
        id: set-targets
        run: |
          targets=()
          samples=()
          for mod in modules/*; do
            if [ -d "$mod" ]; then
              targets+=("$mod")
              if [ -d "$mod/sample" ]; then
                targets+=("$mod/sample")
                samples+=("$mod/sample")
              fi
            fi
          done
          printf 'targets=%s\n' "$(jq -cn --args '$ARGS.positional' "${targets[@]}")" >> "$GITHUB_OUTPUT"
          printf 'samples=%s\n' "$(jq -cn --args '$ARGS.positional' "${samples[@]}")" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.target }})
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest

      - name: Format check (terraform fmt)
        run: |
          terraform -chdir="${{ matrix.target }}" fmt -check -diff

      - name: Initialize without backend (terraform init)
        run: |
          terraform -chdir="${{ matrix.target }}" init -backend=false -input=false

      - name: Validate configuration (terraform validate)
        run: |
          target="${{ matrix.target }}"
          stub=0
          aliases="$(grep -oE 'aws\.[A-Za-z_][A-Za-z0-9_]*' "$target/versions.tf" | sort -u || true)"
          if [ -n "$aliases" ] && ! grep -q 'provider "aws"' "$target"/*.tf 2>/dev/null; then
            for reference in $aliases; do
              alias="${reference#aws.}"
              cat << EOF >> "$target/_ci_provider.tf"
          provider "aws" {
            alias  = "$alias"
            region = "us-east-1"
          }
          EOF
            done
            stub=1
          fi
          terraform -chdir="$target" validate -no-color
          if [ "$stub" -eq 1 ]; then
            rm -f "$target/_ci_provider.tf"
          fi

      - name: Lint module (tflint)
        run: |
          target="${{ matrix.target }}"
          (cd "$target" && tflint --init 2>/dev/null || true && tflint --format compact)

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.target }}
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Run unit tests (terraform test)
        run: |
          target="${{ matrix.target }}"
          if [ -d "$target/tests" ]; then
            terraform -chdir="$target" test
          else
            echo "No tests directory in $target; skipping test suite."
          fi

  plan:
    name: Plan (${{ matrix.sample }})
    needs: [discover]
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - 4566:4566
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.samples) }}
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create plugin cache directory
        run: mkdir -p "${{ env.TF_PLUGIN_CACHE_DIR }}"

      - name: Cache Terraform plugins
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Initialize sample without backend (terraform init)
        run: |
          terraform -chdir="${{ matrix.sample }}" init -backend=false -input=false

      - name: Speculative plan against Floci emulator (terraform plan)
        run: |
          terraform -chdir="${{ matrix.sample }}" plan -lock=false -input=false -out=tfplan

      - name: Publish plan resource summary
        if: always()
        run: |
          sample="${{ matrix.sample }}"
          plan_file="$sample/tfplan"
          echo "### Speculative Plan Summary: \`$sample\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target emulator: Floci 2.4.0 (\`http://localhost:4566\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$plan_file" ]; then
            summary_line=$(terraform -chdir="$sample" show -no-color tfplan | grep -E "^Plan:" || true)
            if [ -n "$summary_line" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Resource Changes:** \`$summary_line\`" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              echo "$summary_line" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No resource changes detected in plan." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Plan file \`$plan_file\` was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
